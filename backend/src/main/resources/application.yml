server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: studyforge
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/studyforge}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

studyforge:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiration-minutes: 120
  ai:
    # Fake "thinking" time so the loading state is visible. Set to 0 to disable.
    delay-ms: 800
    cache-ttl-minutes: 60
    max-requests-per-minute: 5
